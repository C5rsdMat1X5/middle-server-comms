<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Centro de control</title>
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #0e0f12;
      --surface: #17181c;
      --surface2: #1f2127;
      --border: #2b2d35;
      --text: #e8e9ed;
      --dim: #868792;
      --accent: #4da3ff;
      --green: #43c383;
      --red: #f0655a;
      --yellow: #e8b54a;
      --r: 14px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      font-size: 15px;
      line-height: 1.4;
      min-height: 100dvh;
      padding-bottom: env(safe-area-inset-bottom);
    }

    /* ── Header ── */
    header {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 18px;
      padding-top: calc(14px + env(safe-area-inset-top));
      background: rgba(14, 15, 18, .85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
    }

    .title {
      font-size: 17px;
      font-weight: 650;
      letter-spacing: -.01em;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 13px;
      color: var(--dim);
    }

    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--dim);
      transition: .3s;
    }

    .dot.connected {
      background: var(--green);
      box-shadow: 0 0 8px var(--green);
    }

    .dot.connecting {
      background: var(--yellow);
      animation: pulse 1.2s infinite;
    }

    .dot.disconnected {
      background: var(--red);
    }

    @keyframes pulse {

      0%,
      100% {
        opacity: 1
      }

      50% {
        opacity: .35
      }
    }

    /* ── Layout ── */
    main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    @media (min-width: 820px) {
      main {
        display: grid;
        grid-template-columns: 1fr 1fr;
        grid-template-areas: "zones actions" "log history";
        align-items: start;
      }

      #zones-sec {
        grid-area: zones;
      }

      #actions-sec {
        grid-area: actions;
      }

      #log-sec {
        grid-area: log;
      }

      #history-sec {
        grid-area: history;
      }
    }

    /* ── Card ── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r);
      overflow: hidden;
    }

    .card-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 13px 16px;
      border-bottom: 1px solid var(--border);
    }

    .card-head h2 {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: .04em;
      color: var(--dim);
      text-transform: uppercase;
    }

    .count {
      font-size: 12px;
      background: var(--surface2);
      border-radius: 20px;
      padding: 2px 9px;
      color: var(--dim);
      min-width: 24px;
      text-align: center;
    }

    .link-btn {
      background: none;
      border: none;
      color: var(--accent);
      font-size: 13px;
      cursor: pointer;
      font-family: inherit;
      padding: 4px;
    }

    /* ── Zones ── */
    #zone-list {
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .zone {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 13px 14px;
      border-radius: 11px;
      background: var(--surface2);
      border: 1.5px solid transparent;
      transition: border-color .2s, background .2s;
      cursor: pointer;
    }

    .zone.active {
      border-color: var(--accent);
      background: #1a2330;
    }

    .zone-ico {
      font-size: 20px;
      flex-shrink: 0;
      opacity: .85;
    }

    .zone-body {
      flex: 1;
      min-width: 0;
    }

    .zone-name {
      font-weight: 600;
      font-size: 15px;
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .zone-addr {
      font-size: 12px;
      color: var(--dim);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 1px;
    }

    .edit-ico {
      opacity: 0;
      font-size: 13px;
      color: var(--dim);
      transition: .15s;
      flex-shrink: 0;
    }

    .zone:hover .edit-ico {
      opacity: .7;
    }

    .zone-check {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 2px solid var(--border);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      color: #fff;
    }

    .zone.active .zone-check {
      background: var(--accent);
      border-color: var(--accent);
    }

    .empty {
      padding: 30px;
      text-align: center;
      color: var(--dim);
      font-size: 14px;
    }

    /* ── Actions ── */
    .actions-body {
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .target-banner {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: var(--dim);
      padding: 2px;
    }

    .target-banner b {
      color: var(--accent);
    }

    .field label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--dim);
      margin-bottom: 7px;
      text-transform: uppercase;
      letter-spacing: .03em;
    }

    .row {
      display: flex;
      gap: 9px;
    }

    .inp {
      flex: 1;
      min-width: 0;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      font-family: inherit;
      font-size: 15px;
      padding: 12px 13px;
      border-radius: 10px;
      outline: none;
      transition: border-color .2s;
      -webkit-appearance: none;
    }

    .inp:focus {
      border-color: var(--accent);
    }

    .inp::placeholder {
      color: var(--dim);
    }

    .btn {
      padding: 12px 18px;
      border-radius: 10px;
      border: none;
      font-family: inherit;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: filter .15s, background .15s;
      white-space: nowrap;
      flex-shrink: 0;
      min-height: 44px;
    }

    .btn-accent {
      background: var(--accent);
      color: #06121f;
    }

    .btn-green {
      background: var(--green);
      color: #052016;
    }

    .btn-ghost {
      background: var(--surface2);
      color: var(--text);
      border: 1px solid var(--border);
    }

    .btn-red {
      background: transparent;
      color: var(--red);
      border: 1.5px solid var(--red);
    }

    .btn-red:hover {
      background: var(--red);
      color: #fff;
    }

    .btn:active {
      filter: brightness(.9);
    }

    .btn:disabled {
      opacity: .4;
      cursor: not-allowed;
    }

    .btn-wide {
      width: 100%;
    }

    /* Volume */
    .vol-field {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .vol-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .vol-val {
      font-variant-numeric: tabular-nums;
      font-weight: 600;
      color: var(--accent);
    }

    input[type=range] {
      -webkit-appearance: none;
      width: 100%;
      height: 6px;
      border-radius: 3px;
      background: var(--border);
      outline: none;
    }

    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: var(--accent);
      cursor: pointer;
      border: 3px solid var(--surface);
    }

    input[type=range]::-moz-range-thumb {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: var(--accent);
      cursor: pointer;
      border: 3px solid var(--surface);
    }

    .divider {
      height: 1px;
      background: var(--border);
      margin: 2px 0;
    }

    .btn-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 9px;
    }

    /* ── Log & History ── */
    .scroll {
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 300px;
      overflow-y: auto;
    }

    .log-row {
      display: flex;
      gap: 10px;
      padding: 9px 11px;
      border-radius: 9px;
      background: var(--surface2);
      border-left: 3px solid var(--border);
      font-size: 13px;
      animation: fade .2s;
    }

    .log-row.ok {
      border-left-color: var(--green);
    }

    .log-row.error {
      border-left-color: var(--red);
    }

    .log-row.warn {
      border-left-color: var(--yellow);
    }

    .log-row.info {
      border-left-color: var(--accent);
    }

    .log-time {
      color: var(--dim);
      font-size: 12px;
      flex-shrink: 0;
      font-variant-numeric: tabular-nums;
    }

    .log-from {
      color: var(--accent);
      flex-shrink: 0;
    }

    .log-body {
      flex: 1;
      word-break: break-word;
    }

    @keyframes fade {
      from {
        opacity: 0;
        transform: translateY(4px)
      }

      to {
        opacity: 1
      }
    }

    .hist {
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 10px 12px;
      border-radius: 10px;
      background: var(--surface2);
      border: 1px solid var(--border);
      animation: fade .2s;
    }

    .hist-ico {
      font-size: 18px;
      flex-shrink: 0;
      width: 24px;
      text-align: center;
    }

    .hist-body {
      flex: 1;
      min-width: 0;
    }

    .hist-label {
      font-weight: 600;
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .hist-param {
      font-size: 12px;
      color: var(--dim);
      margin-top: 1px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .hist-meta {
      font-size: 11px;
      color: var(--dim);
      margin-top: 2px;
    }

    .hist-run {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      width: 38px;
      height: 38px;
      color: var(--dim);
      cursor: pointer;
      font-size: 14px;
      flex-shrink: 0;
    }

    .hist-run:active {
      background: var(--surface);
    }

    ::-webkit-scrollbar {
      width: 6px;
    }

    ::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 3px;
    }

    /* ── Toast ── */
    #toasts {
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      bottom: calc(20px + env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column-reverse;
      gap: 8px;
      z-index: 100;
      width: calc(100% - 32px);
      max-width: 360px;
    }

    .toast {
      padding: 12px 15px;
      border-radius: 11px;
      background: var(--surface2);
      border: 1px solid var(--border);
      font-size: 14px;
      animation: up .25s;
      box-shadow: 0 8px 24px rgba(0, 0, 0, .4);
    }

    .toast.ok {
      border-color: var(--green);
    }

    .toast.err {
      border-color: var(--red);
    }

    .toast.info {
      border-color: var(--accent);
    }

    @keyframes up {
      from {
        opacity: 0;
        transform: translateY(16px)
      }

      to {
        opacity: 1
      }
    }

    /* ── Modal ── */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .65);
      z-index: 50;
      display: none;
      align-items: flex-end;
      justify-content: center;
      padding: 16px;
      padding-bottom: calc(16px + env(safe-area-inset-bottom));
    }

    .overlay.open {
      display: flex;
      animation: fade .2s;
    }

    @media (min-width: 560px) {
      .overlay {
        align-items: center;
      }
    }

    .sheet {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 22px;
      width: 100%;
      max-width: 380px;
      animation: up .25s;
    }

    .sheet h3 {
      font-size: 17px;
      margin-bottom: 8px;
    }

    .sheet p {
      color: var(--dim);
      font-size: 14px;
      margin-bottom: 18px;
    }

    .sheet-btns {
      display: flex;
      gap: 10px;
    }

    .sheet-btns .btn {
      flex: 1;
    }

    .sheet .inp {
      width: 100%;
      margin-bottom: 18px;
    }
  </style>
</head>

<body>

  <header>
    <span class="title">Control de Audio</span>
    <div class="status"><span class="dot" id="dot"></span><span id="status-lbl">Conectando…</span></div>
  </header>

  <main>
    <!-- Clients -->
    <section id="zones-sec">
      <div class="card">
        <div class="card-head">
          <h2>Clientes</h2><span class="count" id="zone-count">0</span>
        </div>
        <div id="zone-list">
          <div class="empty" id="zones-empty">Ningun cliente conectado</div>
        </div>
      </div>
    </section>

    <!-- Actions -->
    <section id="actions-sec">
      <div class="card">
        <div class="card-head">
          <h2>Reproducir</h2>
        </div>
        <div class="actions-body">
          <div class="target-banner">Enviando a: <b id="target-name">ningun client</b></div>

          <div class="field">
            <label>Audio por URL</label>
            <div class="row">
              <input class="inp" id="audio-url" type="url" placeholder="https://…" autocomplete="off"
                spellcheck="false">
              <button class="btn btn-accent" onclick="sendAudio()">Enviar</button>
            </div>
          </div>

          <div class="field">
            <label>YouTube</label>
            <div class="row">
              <input class="inp" id="yt-url" type="url" placeholder="https://youtube.com/…" autocomplete="off"
                spellcheck="false">
              <button class="btn btn-accent" onclick="sendYT()">Enviar</button>
            </div>
          </div>

          <div class="field">
            <label>Mensaje por voz (TTS)</label>
            <div class="row">
              <input class="inp" id="tts-txt" type="text" placeholder="TTS…" autocomplete="off">
              <button class="btn btn-green" onclick="sendTTS()">Enviar</button>
            </div>
          </div>

          <div class="field vol-field">
            <div class="vol-top"><label style="margin:0">Volumen</label><span class="vol-val" id="vol-val">100%</span>
            </div>
            <input type="range" id="vol" min="0" max="1" step="0.01" value="1">
            <button class="btn btn-ghost btn-wide" onclick="sendVol()">Aplicar volumen</button>
          </div>

          <div class="divider"></div>

          <div class="btn-grid">
            <button class="btn btn-ghost" onclick="sendStop()">⏹ Detener</button>
            <button class="btn btn-ghost" onclick="sendUpdate()">⟳ Actualizar</button>
          </div>

          <button class="btn btn-red btn-wide" onclick="confirmWipe()">Limpiar equipo (reset)</button>
        </div>
      </div>
    </section>

    <!-- Log -->
    <section id="log-sec">
      <div class="card">
        <div class="card-head">
          <h2>Respuestas</h2><button class="link-btn" onclick="clearLog()">Limpiar</button>
        </div>
        <div class="scroll" id="log">
          <div class="empty" id="log-empty">Sin respuestas aún</div>
        </div>
      </div>
    </section>

    <!-- History -->
    <section id="history-sec">
      <div class="card">
        <div class="card-head">
          <h2>Historial</h2><button class="link-btn" onclick="clearHistory()">Limpiar</button>
        </div>
        <div class="scroll" id="history">
          <div class="empty" id="history-empty">Sin acciones aún</div>
        </div>
      </div>
    </section>
  </main>

  <div id="toasts"></div>

  <!-- Wipe confirm -->
  <div class="overlay" id="wipe-overlay">
    <div class="sheet">
      <h3>Limpiar equipo</h3>
      <p id="wipe-msg"></p>
      <div class="sheet-btns">
        <button class="btn btn-ghost" onclick="closeOverlay('wipe-overlay')">Cancelar</button>
        <button class="btn btn-red" id="wipe-confirm">Confirmar</button>
      </div>
    </div>
  </div>

  <!-- Rename -->
  <div class="overlay" id="rename-overlay">
    <div class="sheet">
      <h3 id="rename-title">Renombrar</h3>
      <input class="inp" id="rename-input" type="text" placeholder="Nuevo nombre" autocomplete="off">
      <div class="sheet-btns">
        <button class="btn btn-ghost" onclick="closeOverlay('rename-overlay')">Cancelar</button>
        <button class="btn btn-accent" id="rename-confirm">Guardar</button>
      </div>
    </div>
  </div>

  <script>
    // ── State ──
    let zones = {};            // id -> { addr, name }
    let target = null;
    let history = [];

    // ── SSE ──
    function startSSE() {
      const es = new EventSource('/stream');
      es.onmessage = e => handleEvent(JSON.parse(e.data));
      es.onerror = () => { setStatus('disconnected', 'Sin conexión'); setTimeout(() => { es.close(); startSSE(); }, 4000); };
    }

    function handleEvent(d) {
      switch (d.event) {
        case 'init':
        case 'listeners_update':
          zones = normalize(d.listeners); target = d.current || null;
          if (d.event === 'init') setStatus(d.manager_connected ? 'connected' : 'connecting', d.manager_connected ? 'Conectado' : 'Conectando…');
          renderZones(); break;
        case 'listener_connected':
          zones = normalize(d.listeners); target = d.current || null; renderZones();
          toast(`${nameOf(d.id)} conectada`, 'info'); break;
        case 'listener_disconnected':
          zones = normalize(d.listeners); target = d.current || null; renderZones();
          toast(`${nameOf(d.id)} desconectada`, 'err'); break;
        case 'target_changed': target = d.current; renderZones(); break;
        case 'zone_renamed':
          if (zones[d.id]) zones[d.id].name = d.name; renderZones(); break;
        case 'manager_connected': setStatus('connected', 'Conectado'); break;
        case 'manager_disconnected': setStatus('disconnected', 'Desconectado'); break;
        case 'manager_connecting': setStatus('connecting', 'Conectando…'); break;
        case 'response': addLog(d); break;
        case 'raw': addLog({ rtype: 'raw', msg: d.data, time: d.time }); break;
        case 'history_entry': prependHistory(d.entry); break;
      }
    }

    // listeners may arrive as { id: addr } or { id: {addr,name} }
    function normalize(raw) {
      const out = {};
      for (const id in (raw || {})) {
        const v = raw[id];
        out[id] = (typeof v === 'string') ? { addr: v, name: '' } : { addr: v.addr || '', name: v.name || '' };
      }
      return out;
    }
    function nameOf(id) { return (zones[id] && zones[id].name) || id; }

    // ── Status ──
    function setStatus(s, l) { document.getElementById('dot').className = 'dot ' + s; document.getElementById('status-lbl').textContent = l; }

    // ── Zones ──
    function renderZones() {
      const list = document.getElementById('zone-list'), empty = document.getElementById('zones-empty');
      const ids = Object.keys(zones);
      document.getElementById('zone-count').textContent = ids.length;
      document.getElementById('target-name').textContent = target ? nameOf(target) : 'ninguna zona';
      list.querySelectorAll('.zone').forEach(e => e.remove());
      empty.style.display = ids.length ? 'none' : '';
      ids.forEach(id => {
        const z = zones[id], active = id === target;
        const el = document.createElement('div');
        el.className = 'zone' + (active ? ' active' : '');
        el.onclick = () => switchTarget(id);
        el.innerHTML = `
      <span class="zone-ico">🔊</span>
      <div class="zone-body">
        <div class="zone-name">${esc(nameOf(id))}
          <span class="edit-ico" onclick="event.stopPropagation();renameZone('${esc(id)}')">✎</span>
        </div>
        <div class="zone-addr">${esc(z.addr)}</div>
      </div>
      <div class="zone-check">${active ? '✓' : ''}</div>`;
        list.appendChild(el);
      });
    }

    // ── Log ──
    function addLog(d) {
      const list = document.getElementById('log'); document.getElementById('log-empty').style.display = 'none';
      const cls = ['ok', 'error', 'warn', 'info', 'raw'].includes(d.rtype) ? d.rtype : 'info';
      const icon = { ok: '✓', error: '✗', warn: '⚠', raw: '·' }[d.rtype] || '›';
      const el = document.createElement('div'); el.className = 'log-row ' + cls;
      el.innerHTML = `<span class="log-time">${esc(d.time || '')}</span>${d.from ? `<span class="log-from">${esc(nameOf(d.from))}</span>` : ''}<span class="log-body">${icon} ${d.stage ? `[${esc(d.stage)}] ` : ''}${esc(d.msg || '')}</span>`;
      list.insertBefore(el, list.firstChild);
      while (list.children.length > 101) list.lastChild.remove();
    }
    function clearLog() { const l = document.getElementById('log'); l.querySelectorAll('.log-row').forEach(e => e.remove()); document.getElementById('log-empty').style.display = ''; }

    // ── History ──
    const ICONS = { audio: '🔊', yt: '▶️', tts: '💬', vol: '🎚️', stop: '⏹', update: '⟳', wipe: '🧹' };
    const LABELS = { audio: 'Audio', yt: 'YouTube', tts: 'Mensaje de voz', vol: 'Volumen', stop: 'Detener', update: 'Actualizar', wipe: 'Limpiar equipo' };

    function prependHistory(entry) {
      history.unshift(entry); if (history.length > 200) history.pop();
      const list = document.getElementById('history'); document.getElementById('history-empty').style.display = 'none';
      list.insertBefore(makeHist(entry), list.firstChild);
      while (list.children.length > 201) list.lastChild.remove();
    }
    function makeHist(e) {
      const el = document.createElement('div'); el.className = 'hist'; el.dataset.id = e.id;
      let param = e.label || '';
      if (!param) {
        if (e.type === 'audio' || e.type === 'yt') param = (e.params && e.params.url) || '';
        else if (e.type === 'tts') param = (e.params && e.params.txt) || '';
        else if (e.type === 'vol') param = Math.round(((e.params && e.params.val) || 0) * 100) + '%';
      }
      el.innerHTML = `
    <span class="hist-ico">${ICONS[e.type] || '•'}</span>
    <div class="hist-body">
      <div class="hist-label">${esc(LABELS[e.type] || e.type)}
        <span class="edit-ico" style="opacity:.6" onclick="event.stopPropagation();renameHistory(${e.id})">✎</span>
      </div>
      ${param ? `<div class="hist-param">${esc(param)}</div>` : ''}
      <div class="hist-meta">${esc(e.time || '')} · ${esc(nameOf(e.target) || '?')}</div>
    </div>
    <button class="hist-run" onclick="repeatHist(${e.id})" title="Repetir">▶</button>`;
      return el;
    }
    function repeatHist(id) {
      const e = history.find(x => x.id === id); if (!e) return;
      if (e.type === 'audio') { document.getElementById('audio-url').value = (e.params && e.params.url) || ''; sendAudio(); }
      else if (e.type === 'yt') { document.getElementById('yt-url').value = (e.params && e.params.url) || ''; sendYT(); }
      else if (e.type === 'tts') { document.getElementById('tts-txt').value = (e.params && e.params.txt) || ''; sendTTS(); }
      else if (e.type === 'vol') { document.getElementById('vol').value = (e.params && e.params.val) || 1; updVol(); sendVol(); }
      else if (e.type === 'stop') sendStop();
      else if (e.type === 'update') sendUpdate();
    }
    function clearHistory() { history = []; const l = document.getElementById('history'); l.querySelectorAll('.hist').forEach(e => e.remove()); document.getElementById('history-empty').style.display = ''; }

    // ── Rename (zonas + historial) ──
    function renameZone(id) {
      openRename('Renombrar zona', nameOf(id), async (name) => {
        const r = await api('/api/rename', { id, name });
        if (r.ok) { if (zones[id]) zones[id].name = name; renderZones(); toast('Zona renombrada', 'ok'); }
      });
    }
    function renameHistory(id) {
      const e = history.find(x => x.id === id); if (!e) return;
      openRename('Renombrar entrada', e.label || LABELS[e.type] || '', async (label) => {
        const r = await api('/api/history/rename', { id, label });
        if (r.ok) { e.label = label; const el = document.querySelector(`.hist[data-id="${id}"]`); if (el) el.replaceWith(makeHist(e)); toast('Entrada renombrada', 'ok'); }
      });
    }
    function openRename(title, current, onSave) {
      document.getElementById('rename-title').textContent = title;
      const inp = document.getElementById('rename-input'); inp.value = current;
      document.getElementById('rename-overlay').classList.add('open');
      setTimeout(() => inp.focus(), 100);
      document.getElementById('rename-confirm').onclick = async () => {
        const v = inp.value.trim(); if (!v) { toast('Nombre vacío', 'err'); return; }
        closeOverlay('rename-overlay'); await onSave(v);
      };
      inp.onkeydown = e => { if (e.key === 'Enter') document.getElementById('rename-confirm').click(); };
    }

    // ── Actions ──
    async function sendAudio() { const url = val('audio-url'); if (!url) return toast('URL vacía', 'err'); const r = await api('/api/audio', { url }); if (r.ok) toast(`Audio → ${nameOf(r.target)}`, 'ok'); }
    async function sendYT() { const url = val('yt-url'); if (!url) return toast('URL vacía', 'err'); const r = await api('/api/yt', { url }); if (r.ok) toast(`YouTube → ${nameOf(r.target)}`, 'ok'); }
    async function sendTTS() { const txt = val('tts-txt'); if (!txt) return toast('Mensaje vacío', 'err'); const r = await api('/api/tts', { txt }); if (r.ok) toast(`Mensaje → ${nameOf(r.target)}`, 'ok'); }
    async function sendStop() { const r = await api('/api/stop', {}); if (r.ok) toast('Audio detenido', 'ok'); }
    async function sendUpdate() { const r = await api('/api/update', {}); if (r.ok) toast('Actualizando…', 'ok'); }
    async function sendVol() { const v = document.getElementById('vol').value; const r = await api('/api/vol', { val: v }); if (r.ok) toast(`Volumen ${Math.round(v * 100)}%`, 'ok'); }

    function confirmWipe() {
      if (!target) return toast('Selecciona un cliente', 'err');
      document.getElementById('wipe-msg').textContent = `Se borrara "${nameOf(target)}"`;
      document.getElementById('wipe-confirm').onclick = async () => { closeOverlay('wipe-overlay'); const r = await api('/api/wipe', {}); if (r.ok) toast(`Equipo limpiado → ${nameOf(r.target)}`, 'info'); };
      document.getElementById('wipe-overlay').classList.add('open');
    }
    async function switchTarget(id) { const r = await api('/api/switch', { id }); if (r.ok) target = r.current, renderZones(); }

    async function api(path, body) {
      try { const res = await fetch(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) }); const d = await res.json(); if (d.error) toast(d.error, 'err'); return d; }
      catch { toast('Error de red', 'err'); return {}; }
    }

    // ── UI helpers ──
    function val(id) { return document.getElementById(id).value.trim(); }
    function closeOverlay(id) { document.getElementById(id).classList.remove('open'); }
    function toast(msg, type = 'info') { const c = document.getElementById('toasts'); const el = document.createElement('div'); el.className = 'toast ' + type; el.textContent = msg; c.appendChild(el); setTimeout(() => { el.style.opacity = '0'; el.style.transition = 'opacity .3s'; setTimeout(() => el.remove(), 300); }, 2800); }
    function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
    const updVol = () => { document.getElementById('vol-val').textContent = Math.round(document.getElementById('vol').value * 100) + '%'; };

    document.getElementById('vol').addEventListener('input', updVol);
    document.getElementById('audio-url').addEventListener('keydown', e => { if (e.key === 'Enter') sendAudio(); });
    document.getElementById('yt-url').addEventListener('keydown', e => { if (e.key === 'Enter') sendYT(); });
    document.getElementById('tts-txt').addEventListener('keydown', e => { if (e.key === 'Enter') sendTTS(); });
    document.querySelectorAll('.overlay').forEach(o => o.addEventListener('click', e => { if (e.target === o) o.classList.remove('open'); }));

    // ── Init ──
    (async () => {
      try {
        const s = await (await fetch('/api/state')).json();
        zones = normalize(s.listeners); target = s.current_target || null;
        setStatus(s.manager_connected ? 'connected' : 'connecting', s.manager_connected ? 'Conectado' : 'Conectando…');
        renderZones();
        (s.history || []).reverse().forEach(prependHistory);
      } catch { }
      startSSE();
    })();
  </script>
</body>

</html>
