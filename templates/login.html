<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a" id="meta-theme">
<script>
  (function(){
    try{
      const saved = localStorage.getItem('theme');
      document.documentElement.setAttribute('data-theme', saved || 'dark');
    }catch(e){ document.documentElement.setAttribute('data-theme','dark'); }
  })();
</script>
<link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
<title>Acceder · Audio Control</title>
</head>
<body class="login-page">

<div class="login-shell">
  <div class="login-topbar">
    <button class="btn btn-ghost btn-icon theme-toggle" onclick="toggleTheme()"
            title="Cambiar tema" aria-label="Cambiar tema">
      <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="4"/>
        <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
      </svg>
      <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
      </svg>
    </button>
  </div>

  <form method="POST" class="login-card" autocomplete="on">
    <div class="login-logo"></div>
    <h1>Audio Control</h1>
    <p class="sub">Accede con tus credenciales</p>

    {% if error %}<div class="login-error">{{ error }}</div>{% endif %}

    <label class="input-group" style="margin-bottom:16px">
      <label>Usuario</label>
      <input class="input" type="text" name="username"
             autocomplete="username" required autofocus>
    </label>
    <label class="input-group" style="margin-bottom:20px">
      <label>Contraseña</label>
      <input class="input" type="password" name="password"
             autocomplete="current-password" required>
    </label>

    <button type="submit" class="btn btn-primary btn-block" style="min-height:44px">Entrar</button>
    <div class="login-footer">Sistema de control de audio</div>
  </form>
</div>

<script>
function applyTheme(theme){
  document.documentElement.setAttribute('data-theme', theme);
  localStorage.setItem('theme', theme);
  const meta = document.getElementById('meta-theme');
  if (meta) meta.setAttribute('content', theme === 'dark' ? '#0a0a0a' : '#fafafa');
}
function toggleTheme(){
  document.documentElement.classList.add('theme-transition');
  const cur = document.documentElement.getAttribute('data-theme') || 'dark';
  applyTheme(cur === 'dark' ? 'light' : 'dark');
  setTimeout(() => document.documentElement.classList.remove('theme-transition'), 320);
}
// Sincroniza meta-theme con el tema inicial
applyTheme(document.documentElement.getAttribute('data-theme') || 'dark');
</script>
</body>
</html>
